name: Build Windows Setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Build app and Setup
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Verify install, upgrade, and uninstall
        shell: pwsh
        run: |
          $previousSetup = Join-Path $env:RUNNER_TEMP 'G4Speak-Setup-1.2.1.exe'
          Invoke-WebRequest -Uri 'https://github.com/Vichaya-Lab/g4speak/releases/download/v1.2.1/G4Speak-Setup-1.2.1.exe' -OutFile $previousSetup
          ./scripts/smoke-test.ps1 -PreviousInstaller $previousSetup

      - uses: actions/upload-artifact@v4
        with:
          name: G4Speak-windows
          path: |
            dist/G4Speak.exe
            dist/G4Speak-Setup-1.2.2.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/G4Speak.exe
            dist/G4Speak-Setup-1.2.2.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: docs/releases/v1.2.2.md
          make_latest: true
