name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build exe
        run: |
          pyinstaller G4Speak.spec

      - name: Generate checksum
        shell: pwsh
        run: |
          $releaseHash = (Get-FileHash -LiteralPath dist/G4Speak.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$releaseHash  G4Speak.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: G4Speak-windows
          path: |
            dist/G4Speak.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/G4Speak.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
